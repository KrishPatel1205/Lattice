[package]
name = "lattice"
version = "1.0.0"
description = "A local-first Markdown knowledge workspace"
authors = ["Lattice"]
edition = "2021"

[lib]
name = "lattice_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde_json = "1"
